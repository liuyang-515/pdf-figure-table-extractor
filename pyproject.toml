[project]
name = "pdf-figure-table-extractor"
version = "0.1.0"
description = "Extract tightly cropped, high-resolution figures and tables from PDF files."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "academic-papers",
    "figure-extraction",
    "pdf",
    "table-extraction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]
dependencies = [
    "loguru>=0.7,<1",
    "pymupdf>=1.26,<2",
]

[project.scripts]
pdf-assets = "pdf_figure_table_extractor.cli:main"
pdf-figure-table-extractor = "pdf_figure_table_extractor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_figure_table_extractor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
